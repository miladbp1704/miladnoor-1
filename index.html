<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Milad Noor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #photo {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: block;

      /*
        تصویر کل صفحه را پر می‌کند.
        ممکن است مقدار خیلی کمی از لبه‌های عکس
        برای حفظ نسبت تصویر بریده شود.
      */
      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>

<body>

  <img
    id="photo"
    src="miladnoor.jpg"
    alt="Milad Noor"
  >

</body>
</html>
